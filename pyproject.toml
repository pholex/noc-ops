[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noc-ops"
dynamic = ["version"]
description = "多云运维 ops CLI —— 9 朵云（AWS / 阿里云 / 腾讯云 / 火山引擎 / GCP / Azure / Oracle / Cloudflare / Supabase）+ 本地网络机器：清单同步、运维看板、定时重启、Claude Code / Codex skill；可选 MCP"
readme = "README.md"
authors = [{ name = "Fenghuang" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["multicloud", "ops", "devops", "aws", "aliyun", "tencent-cloud", "gcp", "azure", "oci", "claude-code", "skill", "noc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
# 核心（sync / noc 看板 / doctor / setup / schedule / skill）只用 Python stdlib；
# MCP server 是可选 extra（仅无 shell 的 GUI 客户端需要）；终端自然语言 agent 不在公开包，由扩展包经 noc_ops.default_command 提供。
dependencies = []

[project.urls]
Homepage = "https://github.com/pholex/noc-ops"
Repository = "https://github.com/pholex/noc-ops"
Skill = "https://github.com/pholex/multicloud-ops"

[project.optional-dependencies]
mcp = ["mcp>=2.2.0,<3"]                      # `ops-mcp`：仅无 shell 的 GUI 客户端（Claude Desktop）需要
all = ["noc-ops[mcp]"]                      # 兼容旧写法
dev = ["pytest>=8", "pyyaml", "noc-ops[mcp]"]
sangfor = ["pycryptodome"]   # 深信服 SCP RSA Token 认证；或 pip install cryptography

[project.scripts]
ops = "noc_ops.cli:main"
ops-mcp = "noc_ops.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 确定性离线单元测试（零 LLM，秒级，CI 友好）",
]

[tool.hatch.version]
path = "src/noc_ops/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/noc_ops"]
# 非 .py 资产（看板前端 / 种子 runbook / skill 模板）随包分发
artifacts = [
    "dashboard/index.html",
    "dashboard/favicon.svg",
    "dashboard/vendor/**",
    "assets/runbooks/*.md",
    "assets/*.toml",
    "skill/*.tmpl",
]

[tool.hatch.build.targets.sdist]
include = ["src/noc_ops", "README.md", "CHANGELOG.md", "RELEASE.md", "LICENSE", "NOTICE"]
exclude = ["tests", "scripts", "infra", "docs"]   # 源码包同样只带运行相关文件
