name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-public-content.py --all
      - name: Check outgoing commit content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check-public-content.py --commits "$BASE_SHA..$HEAD_SHA"
          else
            python scripts/check-public-content.py --commits "$HEAD_SHA^!"
          fi
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -m unit -q
      - run: python scripts/check-release.py
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python scripts/check-release.py --dist dist
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/noc-release-test
          /tmp/noc-release-test/bin/pip install dist/*.whl
          /tmp/noc-release-test/bin/ops --version
          /tmp/noc-release-test/bin/ops init --help
          /tmp/noc-release-test/bin/ops doctor --help
          /tmp/noc-release-test/bin/ops find --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
