# "ap-tokyo-1" = ["Tokyo", "🇯🇵"]

# Cloudflare / Supabase 的账号还可设置 token_env = "<ENV_VAR_NAME>"。
# 只记录环境变量名，不放 token 值；变量存在时优先使用，否则回退 macOS Keychain。
